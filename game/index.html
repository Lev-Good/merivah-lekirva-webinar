<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>הדלתות שבינינו</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&family=Heebo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFFBF5;
    --blue:#3F5B6E;
    --muted:#F0E8DA;
    --white:#FFFFFF;
    --ink:#4B5A5A;
    --pink:#F5B8B8;
    --sage:#C3E1D2;
    --clay:#877878;
    --border:#E8E2DC;
    --shadow-soft: 0 1px 2px rgba(42,37,32,0.04), 0 12px 32px -16px rgba(42,37,32,0.18);
    --shadow-lift: 0 2px 4px rgba(42,37,32,0.05), 0 24px 48px -22px rgba(42,37,32,0.22);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:'Heebo',sans-serif;
    direction:rtl;
    min-height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-inline:16px;
    padding-block:28px;
  }
  h1,h2,h3{
    font-family:'Amatic SC',sans-serif;
    font-weight:700;
    line-height:1.0;
    letter-spacing:-0.01em;
    color:var(--blue);
    margin:0;
    text-wrap:balance;
  }
  .stage{
    width:100%;
    max-width:480px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:20px;
  }
  /* ---------- top bar: progress flowers ---------- */
  .progress{
    display:flex;
    flex-wrap:wrap;
    gap:9px;
    align-items:center;
    justify-content:center;
    padding-block:4px;
  }
  .progress svg{width:22px;height:22px;transition:transform .25s ease, opacity .25s ease;}
  .progress .dot-wrap.active svg{transform:scale(1.18);}
  .progress .dot-wrap.done svg{opacity:1;}
  .progress .dot-wrap.todo svg{opacity:.35;}

  /* ---------- cards ---------- */
  .card{
    position:relative;
    width:100%;
    background:var(--white);
    border-radius:20px;
    box-shadow:var(--shadow-soft);
    border:1px solid var(--border);
    padding:28px 24px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
    text-align:center;
  }
  .brand-logo{display:block;width:auto;margin:0 auto;aspect-ratio:629/190;object-fit:contain;}
  .card-logo{margin-bottom:2px;}
  .card-logo .brand-logo{width:220px;}
  .card-foot{
    width:100%;
    margin-top:4px;
    padding-top:12px;
    border-top:1px solid var(--border);
    text-align:center;
  }
  .card-copy{font-size:10.5px;line-height:1.4;color:var(--blue);}

  /* ---------- Tovi Kablan credit strip — right side, rotated, per brand skill ---------- */
  .credit-strip{
    position:absolute;
    top:16px; right:14px;
    width:13px; height:88px;
    pointer-events:none;
  }
  .credit-strip img{
    position:absolute; top:0; left:0;
    width:88px; height:13px;
    transform-origin:top left;
    transform:rotate(90deg) translateY(-100%);
    display:block;
  }

  .eyebrow{
    font-size:13px;
    font-weight:600;
    letter-spacing:.3px;
    color:var(--clay);
  }
  .eyebrow.her{color:#C9748A;}
  .eyebrow.him{color:#4C8A6C;}

  .pill{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:6px 16px;
    border-radius:999px;
    font-size:13px;
    font-weight:600;
  }
  .pill.her{background:var(--pink);color:var(--blue);}
  .pill.him{background:var(--sage);color:var(--blue);}

  .dilemma-text{
    font-size:19px;
    line-height:1.5;
    color:var(--blue);
    font-weight:500;
  }

  .sub{
    font-size:15px;
    line-height:1.6;
    color:var(--ink);
    opacity:.85;
  }

  /* ---------- buttons ---------- */
  .btn{
    font-family:'Heebo',sans-serif;
    font-weight:600;
    font-size:15px;
    border:none;
    cursor:pointer;
    border-radius:999px;
    padding:14px 28px;
    display:inline-flex;
    align-items:center;
    gap:8px;
    justify-content:center;
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
    letter-spacing:.15px;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--blue);color:var(--cream);box-shadow:var(--shadow-soft);}
  .btn-primary:hover{box-shadow:var(--shadow-lift);}
  .btn-ghost{background:var(--white);color:var(--blue);border:1.5px solid var(--border);}
  .btn-wide{width:100%;}

  /* ---------- answer options ---------- */
  .options{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .option{
    width:100%;
    text-align:right;
    background:var(--muted);
    border:1.5px solid transparent;
    border-radius:16px;
    padding:14px 16px;
    font-family:'Heebo',sans-serif;
    font-size:15px;
    font-weight:500;
    color:var(--ink);
    cursor:pointer;
    transition:all .15s ease;
  }
  .option:hover{border-color:var(--blue);}
  .option.selected{
    background:var(--blue);
    color:var(--cream);
    box-shadow:var(--shadow-soft);
  }

  /* ---------- reveal pair ---------- */
  .reveal-row{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .reveal-item{
    border-radius:16px;
    padding:14px 16px;
    text-align:right;
    font-size:14.5px;
    line-height:1.5;
    border:1.5px solid var(--border);
  }
  .reveal-item.her{background:#FDF3F3;}
  .reveal-item.him{background:#F2F8F4;}
  .reveal-item .who{font-weight:700;font-size:12.5px;display:block;margin-bottom:4px;}
  .reveal-item.her .who{color:#C9748A;}
  .reveal-item.him .who{color:#4C8A6C;}

  .insight-box{
    width:100%;
    background:var(--muted);
    border-radius:16px;
    padding:16px 18px;
    text-align:right;
    position:relative;
  }
  .insight-box .label{
    font-size:12.5px;
    font-weight:700;
    color:var(--blue);
    display:flex;
    align-items:center;
    gap:6px;
    margin-bottom:6px;
  }
  .insight-box p{margin:0;font-size:14.5px;line-height:1.6;color:var(--ink);}

  /* ---------- door scene ---------- */
  .door-scene{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    padding-block:8px;
  }
  .door-num{
    font-family:'Amatic SC',sans-serif;
    font-size:80px;
    line-height:1;
    color:var(--blue);
  }

  /* ---------- handoff ---------- */
  .handoff-icon{
    width:70px;height:70px;
    border-radius:50%;
    background:var(--muted);
    display:flex;align-items:center;justify-content:center;
  }

  /* ---------- footer brand ---------- */
  .brand-foot{
    margin-top:6px;
    font-size:12px;
    color:var(--clay);
    letter-spacing:.2px;
    text-align:center;
  }
  .brand-foot b{color:var(--blue);}

  /* ---------- intro ---------- */
  .intro-flower{width:92px;height:92px;}
  .intro-title{font-size:58px;}
  .rule-list{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:10px;
    text-align:right;
  }
  .rule-item{
    display:flex;
    gap:10px;
    align-items:flex-start;
    font-size:14px;
    line-height:1.55;
    color:var(--ink);
  }
  .rule-item svg{flex:none;margin-top:2px;}

  /* ---------- summary ---------- */
  .summary-flower{width:150px;height:150px;}
  .tags{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
  .tag{background:var(--muted);color:var(--blue);font-size:12.5px;font-weight:600;padding:6px 14px;border-radius:999px;}

  .fade-in{animation:fadeIn .4s cubic-bezier(.2,.7,.3,1) both;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(10px) scale(.985);}to{opacity:1;transform:translateY(0) scale(1);}}

  /* ---------- door opening ---------- */
  .door-visual{
    position:relative;
    transform-style:preserve-3d;
    perspective:700px;
    animation:doorBreathe 3.4s ease-in-out infinite;
  }
  .door-visual svg{display:block; transform-origin:92% 50%; transition:none;}
  .door-visual.opening svg{
    animation:doorSwing .62s cubic-bezier(.5,0,.75,0) forwards;
  }
  .light-beam{
    position:absolute; inset:0;
    border-radius:14px;
    background:radial-gradient(ellipse at 80% 50%, rgba(245,184,184,.9), rgba(245,184,184,0) 70%);
    opacity:0; pointer-events:none;
  }
  .door-visual.opening .light-beam{ animation:lightBeam .62s ease-out forwards; }
  @keyframes doorBreathe{0%,100%{transform:translateY(0);}50%{transform:translateY(-3px);}}
  @keyframes doorSwing{
    0%{transform:perspective(700px) rotateY(0deg);}
    100%{transform:perspective(700px) rotateY(-68deg); opacity:.15;}
  }
  @keyframes lightBeam{
    0%{opacity:0; transform:scale(.85);}
    55%{opacity:.85;}
    100%{opacity:0; transform:scale(1.3);}
  }

  /* ---------- progress flower bloom ---------- */
  .dot-wrap.just-done svg{animation:flowerDone .55s cubic-bezier(.3,1.6,.5,1) both;}
  @keyframes flowerDone{
    0%{transform:scale(1) rotate(0deg);}
    40%{transform:scale(1.55) rotate(10deg);}
    70%{transform:scale(.92) rotate(-4deg);}
    100%{transform:scale(1.18) rotate(0deg);}
  }

  /* ---------- answer select pop ---------- */
  .option.just-picked{animation:popSelect .4s cubic-bezier(.3,1.4,.4,1) both;}
  @keyframes popSelect{
    0%{transform:scale(1);}
    35%{transform:scale(.95);}
    70%{transform:scale(1.025);}
    100%{transform:scale(1);}
  }

  /* ---------- handoff swing ---------- */
  .handoff-icon{animation:handoffFloat 1.8s ease-in-out infinite;}
  .handoff-icon svg{animation:handoffSwing 1.8s ease-in-out infinite;}
  @keyframes handoffFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);}}
  @keyframes handoffSwing{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(5px);}
    75%{transform:translateX(-5px);}
  }

  /* ---------- reveal stagger ---------- */
  .reveal-item.her{animation:slideInRight .45s cubic-bezier(.2,.7,.3,1) both; animation-delay:.05s;}
  .reveal-item.him{animation:slideInLeft .45s cubic-bezier(.2,.7,.3,1) both; animation-delay:.22s;}
  .insight-box{animation:slideUpIn .45s cubic-bezier(.2,.7,.3,1) both; animation-delay:.42s;}
  @keyframes slideInRight{from{opacity:0; transform:translateX(26px);}to{opacity:1; transform:translateX(0);}}
  @keyframes slideInLeft{from{opacity:0; transform:translateX(-26px);}to{opacity:1; transform:translateX(0);}}
  @keyframes slideUpIn{from{opacity:0; transform:translateY(14px);}to{opacity:1; transform:translateY(0);}}

  /* ---------- summary flower bloom ---------- */
  .summary-flower svg circle{
    animation:petalBloom .6s cubic-bezier(.2,1.5,.4,1) both;
    transform-origin:24px 24px;
  }
  .summary-flower svg circle:nth-of-type(1){animation-delay:.05s;}
  .summary-flower svg circle:nth-of-type(2){animation-delay:.2s;}
  .summary-flower svg circle:nth-of-type(3){animation-delay:.35s;}
  .summary-flower svg circle:nth-of-type(4){animation-delay:.5s;}
  .summary-flower svg circle:nth-of-type(5){animation-delay:.65s;}
  .summary-flower svg circle:nth-of-type(6){animation-delay:.8s;}
  @keyframes petalBloom{
    0%{transform:scale(0) rotate(-35deg); opacity:0;}
    65%{transform:scale(1.2) rotate(6deg); opacity:1;}
    100%{transform:scale(1) rotate(0deg); opacity:1;}
  }
  .summary-flower{animation:summaryPulse 3s ease-in-out .9s infinite;}
  @keyframes summaryPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.035);}}

  .tags .tag{animation:slideUpIn .4s cubic-bezier(.2,.7,.3,1) both;}
  .tags .tag:nth-child(1){animation-delay:.9s;}
  .tags .tag:nth-child(2){animation-delay:1.0s;}
  .tags .tag:nth-child(3){animation-delay:1.1s;}
  .tags .tag:nth-child(4){animation-delay:1.2s;}

  /* ---------- button micro-interactions ---------- */
  .btn-primary{position:relative; overflow:hidden;}
  .btn-primary::after{
    content:"";
    position:absolute; inset:0;
    background:radial-gradient(circle at 50% 50%, rgba(255,251,245,.35), transparent 60%);
    opacity:0; transition:opacity .3s ease;
  }
  .btn-primary:active::after{opacity:1;}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; transition-duration:0.01ms !important; animation-iteration-count:1 !important;}
  }

</style>

  var CREDIT_WHITE_SRC = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAPoAAAAlCAYAAABrhPTHAAAF40lEQVR4nO2c65HbNhCA4Uz+mx1EV4F5FZhXwekqCK8CSxVIqUBKBVQq0KWCkysQXYHoCqQOmMHMwkZoYPEkCVL7zXDmdHwABLDAvsAPbdsygiDmzW9jV4AgiP4hQSeIO4AEnUiNgjHWao4YtJqDlztbSNAJ4g6IIejvitlxC+e2yAza3uvsipAzxsrAZ2BtHno/P3aB9SNG4PcxCiW0Qs4nzQx+H0ZoJz7BbpDzJ8bYesD6EJEg1T1NIa8YY8uB68DLPiLnb4yxlwHrQ0SEBD09IWeSsPNzQ3FU1EHmCYSdmCAk6GkJ+Zuksmdwbghh3xr8Iq+MsXqAehAJ2+hrxUrQWNzHVwgdqkG1gCODwX+TrqsnuNp0hZy/w1fpPUpJ2J96FDSTXX4YyV9gQoyHxnK8TZW8I19+78tTYHs8tq0em/uztm13bdteWjPntm1Lw/MK5P6LRX2OyP2FdB3GO1xTduq+kn6v4H+CXU9tztv3ilx/NpTF38WWK7RfSB8VSB+c4d0zw/Nt+s+2PbF6LDzbTtxbIX1zhfOmMn4cKQt6aRiEWEPnHoNICKDuWCL3bi0HU7ecSiHkXWGvemxzTFCvAYPVxBkRSKyPbLhCX40l6HI9So+2OzuMe9O7/jhStdGX4IzCnEMmlZirdbHIoD4qailvwBVu+/6tiU3v4By/Zgy7/KVHlVj0UZ/RgyEdmdiYyQNV9ShlpCrooUkZWeTEjo2m8UNDTmVnAuG28F76XUVIoPGxy9cQM089OQgjlcSeTc/Pz2zKSDFhpkRW4xsIw1d4wc/IYFlKzhobakQoVohANBGFXKzemfRe4prDQPHy7mSDUTs4zVQ8e7zXDaITN+gb3WpWOPa/jsZy0tNpR8uAcv+Bvz9K41lXRoY6pBO00blNqkNle6vsW8HKwf7r2tkM7EidI/DoYQfqnHGVoR3KiG3+7mk7hxyYA83FRr8o6of1v6rdXG1026N0fDbWD5WHMxi11VNU3XWz1kGzguyRWdvHxpfZaOrTRLCdxQour+Qy8rnDAHb5DcrqI0zJfQ0qXO3XvxT12yN1jumnMXGI5NO4IWnGWPpxPjXVXVfh78g9jaZTPwfWQ6eyxxIIU4w6tiNuYxCi2LH6JfRBrE1KNfL/sTZC5VD2c6SJBcsJaeC8s6MxRUEPXYV96dphFSIQfTuq+uKA+DS+wPnQCYwP+j8luzEmqWTnLaC9MLvZF+5/wvDqnxRV9xTYambNkFBaCqwRYVkYnHQm+ARygbCZyOqbGzm00QW0vSFNgyBI0NWduZnp7i2THV54hKVEmm41pYHvAW+X8wi7CqNAgv4rux5CaSlRG5w6K4fBvIDVrTCUl2KuvAsV4q9hMC72CZkWv0CC/pMTdKZq0Mq7yuaAyQlom9GFbW3lz39gjD1K8eApskX8GjVoeQ8weSa7sYoE/f+r06anUNrU7HWRWonZ2UtkMniFYw4a0BdkInuERSB5SNB/ohvYfcWWx0b4HHTvliORByx0uZ+R9lNoxsTkJv8UBV0XuvoDuUfnBHKxmQrNoJ1qKM0G04BdIlGG3DM81Af5wM9t2MRIUdBvjqoilhuPJdmEOq3mwpsht33j6GkOSVLydZ7qTAwXTSxX/E/33MlFF1JMmPlXM7BEGEfO4Ho2eEPfAsNQ98LasEGkgjZvLIRoBX313VIbc0HWLj5BfTGhOzlOGM/wnt+QlGsGZb4rtJexJ4BcEzV6SlHQ35BZ2mX76SlAxeojHTR1XiBOrGv3Y+cDkd+Qlb5MYMunSBftckNW6gKOk0Xuurg2JTJdnVJV3V9HfIZJlb1Xe727WqTucHuNoOXVc/HRpCjoojN8vd0NrDw+q/m9qeyuk1wpmUqpep5FH54cdsBhJB0fn7qgy3FKbBuqynn2GKB2   function creditStrip(dark){
    var src = dark===false ? CREDIT_WHITE_SRC : CREDIT_DARK_SRC;
    return '<div class="credit-strip"><img src="'+src+'" alt="Tovi Kablan" /></div>';
  }
  function cardBrandFoot(){
    return creditStrip(true)+'<div class="card-foot"><span class="card-copy">יובל סודאי · כל הזכויות שמורות<br>yuvalsudai.com</span></div>';
  }

  // ---------- tiny icon library (no human figures) ----------
  function iconFlower(size, openness){
    openness = openness===undefined?1:openness;
    var s = size||24;
    var petals = ['#F5B8B8','#C3E1D2','#F5B8B8','#C3E1D2','#F5B8B8'];
    var r = 7*openness;
    var html = '<svg viewBox="0 0 48 48" width="'+s+'" height="'+s+'" xmlns="http://www.w3.org/2000/svg">';
    for(var i=0;i<5;i++){
      var ang = (i/5)*Math.PI*2 - Math.PI/2;
      var cx = 24 + Math.cos(ang)*9*openness;
      var cy = 24 + Math.sin(ang)*9*openness;
      html += '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+petals[i]+'" opacity="0.95"/>';
    }
    html += '<circle cx="24" cy="24" r="6" fill="#3F5B6E"/>';
    html += '</svg>';
    return html;
  }

  function iconDoor(size){
    var s = size||64;
    return '<svg viewBox="0 0 120 160" width="'+s+'" height="'+(s*160/120)+'" xmlns="http://www.w3.org/2000/svg">'+
      '<rect x="10" y="10" width="100" height="140" rx="14" fill="#F0E8DA" stroke="#3F5B6E" stroke-width="3"/>'+
      '<rect x="24" y="24" width="72" height="112" rx="8" fill="#FFFBF5" stroke="#E8E2DC" stroke-width="2"/>'+
      '<circle cx="80" cy="82" r="4.5" fill="#3F5B6E"/>'+
      '<path d="M96 24 L118 10 L118 150 L96 136 Z" fill="#F5B8B8" opacity="0.55"/>'+
      '</svg>';
  }

  function iconHandoff(size){
    var s = size||40;
    return '<svg viewBox="0 0 48 48" width="'+s+'" height="'+s+'" xmlns="http://www.w3.org/2000/svg">'+
      '<path d="M8 24 H34" stroke="#3F5B6E" stroke-width="2.5" fill="none" stroke-linecap="round"/>'+
      '<path d="M26 16 L36 24 L26 32" stroke="#3F5B6E" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>'+
      '</svg>';
  }

  function iconCheck(size,color){
    var s=size||16;
    return '<svg viewBox="0 0 24 24" width="'+s+'" height="'+s+'" xmlns="http://www.w3.org/2000/svg">'+
      '<circle cx="12" cy="12" r="11" fill="'+(color||'#C3E1D2')+'"/>'+
      '<path d="M7 12.5 L10.3 16 L17 8.5" stroke="#3F5B6E" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>'+
      '</svg>';
  }

  // ---------- state ----------
  var state = {
    screen: "intro",     // intro | turn | summary
    turn: "her",
    deckHer: [],
    deckHim: [],
    currentIndex: null,
    skipsUsed: 0
  };

  function shuffledIndices(n){
    var a = [];
    for(var i=0;i<n;i++){ a.push(i); }
    for(var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var tmp=a[i]; a[i]=a[j]; a[j]=tmp;
    }
    return a;
  }
  function deckFor(t){ return t==='her' ? state.deckHer : state.deckHim; }
  function otherTurn(t){ return t==='her' ? 'him' : 'her'; }

  function loadState(){
    try{
      var raw = localStorage.getItem("sudai-doors-v2");
      if(raw){
        var saved = JSON.parse(raw);
        if(saved && saved.deckHer && saved.deckHim){ state = saved; }
      }
    }catch(e){}
  }
  function saveState(){
    try{ localStorage.setItem("sudai-doors-v2", JSON.stringify(state)); }catch(e){}
  }

  function go(screen){ state.screen = screen; saveState(); render(); window.scrollTo(0,0); }

  function drawCard(t){
    var deck = deckFor(t);
    state.currentIndex = deck.pop();
  }

  function advance(wasSkip){
    if(wasSkip){ state.skipsUsed++; }
    var t = state.turn;
    var nt = otherTurn(t);
    if(state.deckHer.length===0 && state.deckHim.length===0){ go('summary'); return; }
    if(deckFor(nt).length===0){ nt = t; }
    if(deckFor(nt).length===0){ go('summary'); return; }
    state.turn = nt;
    drawCard(nt);
    go('turn');
  }

  // ---------- progress bars ----------
  function renderProgress(){
    var her = TOTAL_PER_DECK - state.deckHer.length;
    var him = TOTAL_PER_DECK - state.deckHim.length;
    function bar(label, val, color){
      var pct = Math.round(val/TOTAL_PER_DECK*100);
      return '<div style="width:100%;text-align:right;">'+
        '<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--clay);margin-bottom:3px;"><span>'+label+'</span><span>'+val+'/'+TOTAL_PER_DECK+'</span></div>'+
        '<div style="width:100%;height:6px;background:var(--muted);border-radius:999px;overflow:hidden;"><div style="width:'+pct+'%;height:100%;background:'+color+';"></div></div>'+
      '</div>';
    }
    return '<div style="width:100%;display:flex;flex-direction:column;gap:8px;">'+bar('הקלפים שלה', her, '#F5B8B8')+bar('הקלפים שלו', him, '#C3E1D2')+'</div>';
  }

  // ---------- screens ----------
  function screenIntro(){
    return '' +
    '<div class="card fade-in">'+
      cardLogo()+
      '<div class="intro-flower">'+iconFlower(92,1)+'</div>'+
      '<h1 class="intro-title">הדלתות<br>שבינינו</h1>'+
      '<p class="sub">משחק פתיחות לזוג — 45 שאלות לו, ו-45 שאלות לה, בהשראת הדרך שיובל סודאי מלמד להתקרב בלי לפצוע.</p>'+
      '<div class="rule-list">'+
        '<div class="rule-item">'+iconCheck(18,'#C3E1D2')+'<span>שתי חפיסות וירטואליות — אחת לו ואחת לה, 45 קלפים בכל אחת.</span></div>'+
        '<div class="rule-item">'+iconCheck(18,'#F5B8B8')+'<span>כל אחד שולף בתורו קלף אקראי מהחפיסה שלו, ועונה עליו בקול.</span></div>'+
        '<div class="rule-item">'+iconCheck(18,'#C3E1D2')+'<span>מותר לוותר על קלף — עד 3 ויתורים בסך הכול למשחק, לא יותר.</span></div>'+
        '<div class="rule-item">'+iconCheck(18,'#F5B8B8')+'<span>אין תשובה נכונה. המטרה היא לראות זה את זה, לא לנצח.</span></div>'+
      '</div>'+
      '<button class="btn btn-primary btn-wide" onclick="window.__sudai.start()">לקלף הראשון ←</button>'+
      cardBrandFoot()+
    '</div>';
  }

  function screenTurn(){
    var t = state.turn;
    var arr = t==='her' ? CARDS_HER : CARDS_HIM;
    var text = arr[state.currentIndex];
    var label = t==='her' ? 'תורה — היא שולפת' : 'תורו — הוא שולף';
    var pillClass = t==='her' ? 'her' : 'him';
    var skipsLeft = MAX_SKIPS - state.skipsUsed;
    var html = '';
    html += renderProgress();
    html += '<div class="card fade-in">';
    html += cardLogo();
    html += '<span class="pill '+pillClass+'">'+label+'</span>';
    html += '<p class="dilemma-text">'+text+'</p>';
    html += '<p class="sub">ענו בקול — אין תשובה נכונה.</p>';
    html += '<button class="btn btn-primary btn-wide" onclick="window.__sudai.answered()">עניתי — לקלף הבא ←</button>';
    html += '<button class="btn btn-ghost btn-wide"'+(skipsLeft<=0 ? ' disabled style="opacity:.4;cursor:not-allowed;"' : '')+' onclick="window.__sudai.skip()">לוותר על הקלף ('+skipsLeft+' ויתורים נותרו)</button>';
    html += cardBrandFoot();
    html += '</div>';
    return html;
  }

  function screenSummary(){
    var total = (TOTAL_PER_DECK - state.deckHer.length) + (TOTAL_PER_DECK - state.deckHim.length);
    return '' +
    '<div class="card fade-in">'+
      cardLogo()+
      '<div class="summary-flower">'+iconFlower(150,1)+'</div>'+
      '<h1 style="font-size:52px;">סיימתם את<br>המשחק</h1>'+
      '<p class="sub">עברתם '+total+' קלפים מתוך 90, ו-'+state.skipsUsed+' ויתורים בדרך. כל קלף שנענה הוא רגע שבו מישהו הסכים להיראות.</p>'+
      '<div class="insight-box"><span class="label">'+iconFlower(16,1)+' לסיום</span><p>יובל סודאי, פסיכותרפיסט ויועץ זוגי 16 שנה, מלווה זוגות בדיוק בשיחות כאלה — עם כלים מעשיים להמשיך איתן הביתה.</p></div>'+
      '<button class="btn btn-primary btn-wide" onclick="window.open(\'https://katzr.net/8634aa\',\'_blank\')">להצטרפות לקהילת זוג או פרט ←</button>'+
      '<button class="btn btn-ghost btn-wide" onclick="window.__sudai.restart()">לשחק שוב מההתחלה</button>'+
      cardBrandFoot()+
    '</div>';
  }

  function render(){
    var app = document.getElementById('app');
    var html = '';
    switch(state.screen){
      case 'intro': html = screenIntro(); break;
      case 'turn': html = screenTurn(); break;
      case 'summary': html = screenSummary(); break;
      default: html = screenIntro();
    }
    app.innerHTML = html;
  }

  // ---------- actions ----------
  window.__sudai = {
    start: function(){
      state.deckHer = shuffledIndices(TOTAL_PER_DECK);
      state.deckHim = shuffledIndices(TOTAL_PER_DECK);
      state.skipsUsed = 0;
      state.turn = Math.random() < 0.5 ? 'her' : 'him';
      drawCard(state.turn);
      go('turn');
    },
    answered: function(){ advance(false); },
    skip: function(){
      if(state.skipsUsed >= MAX_SKIPS) return;
      advance(true);
    },
    restart: function(){
      state = {screen:'intro', turn:'her', deckHer:[], deckHim:[], currentIndex:null, skipsUsed:0};
      saveState();
      render();
      window.scrollTo(0,0);
    }
  };

  // ---------- hot reload support ----------
  function snapshot(){ return state; }
  function boot(initial){
    if(initial && typeof initial.doorIndex === 'number'){ state = initial; }
    else { loadState(); }
    render();
  }

  try{
    if(window.claude && window.claude.hot){
      window.claude.hot.snapshot(snapshot);
      window.claude.hot.ready ? window.claude.hot.ready(boot) : boot(window.claude.hot.data);
    } else {
      boot();
    }
  }catch(e){ boot(); }
})();
</script>
